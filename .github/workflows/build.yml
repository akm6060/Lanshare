name: Build LanShare APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lets you upload the whole project as one zip file from an iPad
      - name: Unpack LanShare-source.zip (if present)
        run: |
          if [ -f LanShare-source.zip ]; then
            unzip -o -q LanShare-source.zip -d _src
            if [ -d _src/LanShare ]; then cp -a _src/LanShare/. . ; else cp -a _src/. . ; fi
            rm -rf _src
          fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LanShare.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LanShare-apk
          path: LanShare.apk
